[platformio]
# Окружения, которые будут активны по умолчанию
default_envs = esp32_core, arduino_safety

[env]
framework = arduino
# Автоматически подключаем общую папку include для сборщиков обеих плат
build_flags = -I include

# --- Конфигурация для ESP32 (Main Unit: KinCony KC868-A6, ESP32-WROOM-32) ---
# board = esp32dev подходит для A6 (ESP32). CH340C на плате, USB-C. Не ESP32-S3.
[env:esp32_core]
platform = espressif32
board = esp32dev
monitor_speed = 115200
# Говорим PlatformIO брать код ТОЛЬКО из этой папки
build_src_filter = +<../src_esp32/>

# --- Конфигурация для Arduino Nano (Ядро безопасности) ---
[env:arduino_safety]
platform = atmelavr
board = nanoatmega328new
monitor_speed = 9600
# Говорим PlatformIO брать код ТОЛЬКО из этой папки
build_src_filter = +<../src_avr8/>
